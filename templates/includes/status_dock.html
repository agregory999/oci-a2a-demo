<style>.workflow-nav a[href$="select-ai?view=cleanup"],.workflow-nav a[href$="agents?view=refresh"]{display:none}</style><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.workflow-nav a[href*="oauth-clients"]').forEach(a=>a.textContent='OAuth Registration');document.querySelectorAll('.workflow-nav a[href*="connect?view=admin"]').forEach(a=>a.textContent='Database Connections');document.querySelectorAll('.workflow-nav a[href*="connect?view=status"]').forEach(a=>a.textContent='Database Lifecycle');const selectAi=document.querySelector('.workflow-nav a[href*="select-ai?view=select-ai"]');if(selectAi&&!document.querySelector('.workflow-nav a[href="/agent-config"]')){const config=document.createElement('a');config.href='/agent-config';config.textContent='Select AI Agent Configs';config.className='child';if(location.pathname==='/agent-config')config.classList.add('active');selectAi.insertAdjacentElement('afterend',config);}});</script><aside class="setup-dock" aria-live="polite"><div class="dock-heading"><strong>Recent activity</strong><span>Newest first · local browser-session log</span></div><div class="activity-log">{% for entry in activity_log %}<div class="result {{entry.category}}"><small>{{entry.timestamp}} · {{entry.section|replace('-', ' ')|title}}</small>{{entry.message}}</div>{% else %}<p class="hint">Actions and their results will appear here.</p>{% endfor %}</div></aside>
