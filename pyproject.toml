[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-a2a-demo"
version = "0.1.0"
description = "Local Flask console for provisioning and validating OCI Autonomous AI Database A2A agents"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "requests>=2.31,<3.0",
    "oracledb>=3.0,<4.0",
]

[tool.setuptools]
py-modules = ["app"]
